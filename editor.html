<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактор — ALLforIR</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/editor.css">
</head>
<body>
<header class="header"><div class="container header-inner">
<a href="/" class="logo"><div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M12 2C8 2 4 3.5 4 6v9.5C4 17.5 6 19 8 19.5V21c0 .5.5 1 1 1h2c.5 0 1-.5 1-1v-1h0v1c0 .5.5 1 1 1h2c.5 0 1-.5 1-1v-1.5c2-.5 4-2 4-4V6c0-2.5-4-4-8-4z"/></svg></div><div class="logo-text">ALL<span>for</span>IR</div></a>
<nav class="nav">
<a href="/" class="nav-link"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Главная</a>
<a href="/catalog.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4z"/></svg>Каталог</a>
<a href="/editor.html" class="nav-link active"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg>Редактор</a>
<a href="/admin/" class="nav-link"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4z"/></svg>Админ</a>
</nav>
</div></header>
<div class="editor-page"><div class="editor-container">
<div class="toolbar">
<button class="tool-btn active" data-tool="brush" data-tooltip="Кисть (B)"><svg viewBox="0 0 24 24"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34c-.39-.39-1.02-.39-1.41 0L9 12.25 11.75 15l8.96-8.96c.39-.39.39-1.02 0-1.41z"/></svg></button>
<button class="tool-btn" data-tool="eraser" data-tooltip="Ластик (E)"><svg viewBox="0 0 24 24"><path d="M16.24 3.56l4.95 4.94c.78.79.78 2.05 0 2.84L12.29 20.2a2.01 2.01 0 0 1-2.83 0L4.51 15.2c-.78-.78-.78-2.05 0-2.83l11.73-11.7c.78-.79 2.05-.79 2.83 0z"/></svg></button>
<button class="tool-btn" data-tool="rect" data-tooltip="Прямоугольник (R)"><svg viewBox="0 0 24 24"><path d="M3 5v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H5c-1.11 0-2 .9-2 2z"/></svg></button>
<button class="tool-btn" data-tool="circle" data-tooltip="Круг (C)"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg></button>
<div class="toolbar-divider"></div>
<button class="tool-btn" data-tool="fill" data-tooltip="Заливка (F)"><svg viewBox="0 0 24 24"><path d="M16.56 8.94L7.62 0 6.21 1.41l2.38 2.38-5.15 5.15c-.59.59-.59 1.54 0 2.12l5.5 5.5c.29.29.68.44 1.06.44s.77-.15 1.06-.44l5.5-5.5c.59-.58.59-1.53 0-2.12z"/></svg></button>
<button class="tool-btn" data-tool="eyedropper" data-tooltip="Пипетка (I)"><svg viewBox="0 0 24 24"><path d="M20.71 5.63l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-3.12 3.12-1.93-1.91-1.41 1.41 1.42 1.42L3 16.25V21h4.75l8.94-8.94 1.42 1.42 1.41-1.41-1.92-1.92 3.12-3.12z"/></svg></button>
<div class="toolbar-divider"></div>
<button class="tool-btn" data-action="undo" data-tooltip="Отменить (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg></button>
<button class="tool-btn" data-action="redo" data-tooltip="Повторить (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg></button>
<button class="tool-btn" data-action="clear" data-tooltip="Очистить"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12z"/></svg></button>
</div>
<div class="canvas-area" id="canvasArea">
<div class="canvas-wrapper"><canvas id="editorCanvas" width="1024" height="512"></canvas></div>
<div class="canvas-info"><span id="cursorPos">X: 0 Y: 0</span><span>|</span><span>1024x512</span><span>|</span><span id="zoomLevel">100%</span></div>
<div class="zoom-controls">
<button class="zoom-btn" id="zoomOut"><svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg></button>
<span class="zoom-value" id="zoomValue">100%</span>
<button class="zoom-btn" id="zoomIn"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
</div>
</div>
<div class="panel">
<div class="panel-section"><div class="panel-header"><span class="panel-title">Цвет</span></div>
<div class="color-picker">
<div class="color-preview"><div class="color-swatch" id="currentColor"><div class="color-fill" style="background:#ff6b35"></div></div>
<div class="color-inputs"><input type="text" class="color-hex" id="colorHex" value="#ff6b35"><input type="color" id="colorPicker" value="#ff6b35"></div>
</div>
<div class="palette" id="palette"></div>
</div></div>
<div class="panel-section"><div class="panel-header"><span class="panel-title">Размер</span></div>
<div class="size-control">
<div class="size-preview"><span>Размер</span><span class="size-value" id="sizeValue">8px</span></div>
<input type="range" class="size-slider" id="sizeSlider" min="1" max="100" value="8">
</div></div>
<div class="panel-section"><div class="panel-header"><span class="panel-title">Слои</span>
<div class="panel-actions"><button class="panel-btn" id="addLayerBtn"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button></div></div>
<div class="layers-list" id="layersList"></div></div>
<div class="panel-section"><div class="panel-header"><span class="panel-title">Действия</span></div>
<div class="action-buttons">
<button class="btn btn-primary" id="saveBtn"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Сохранить PNG</button>
<button class="btn btn-secondary" id="saveProjectBtn"><svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4z"/></svg>Сохранить проект</button>
</div></div>
</div>
</div></div>
<div class="toast-container" id="toastContainer"></div>
<script src="js/app.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
